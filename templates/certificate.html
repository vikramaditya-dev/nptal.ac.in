<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate – {{ cert.student_name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
  width: 100%; height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

    
    .cert-wrapper {
  margin-top: 0;
  width: 100%;
  max-width: 100%;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  background: #fff;
}

.cert-wrapper img {
  width: 100%;
  height: auto;
  max-width: 100%;
  object-fit: fill;
  border-radius: 0;
  box-shadow: none;
  display: block;
}

    .pdf-frame {
      width: 100%;
      height: calc(100vh - 80px);
      border: none;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      background: #fff;
    }

    .pdf-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: #c5cae9;
      text-align: center;
      padding: 2rem;
    }
    .pdf-fallback svg { width: 64px; height: 64px; opacity: .7; }
    .pdf-fallback p { font-size: 1rem; opacity: .8; }
    .pdf-fallback a {
      display: inline-block;
      background: #3949ab;
      color: #fff;
      padding: .65rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: .95rem;
      transition: background .2s;
    }
    .pdf-fallback a:hover { background: #1a237e; }
  </style>
</head>
<body>



<div class="cert-wrapper">
  {% set img_url = cert.image_url %}
  {% set ext = img_url.rsplit('.', 1)[-1].lower().split('?')[0] %}

  {% if ext == 'pdf' %}
    <iframe
      class="pdf-frame"
      id="pdfFrame"
      src="{{ img_url }}"
      title="Certificate PDF">
    </iframe>

    <div class="pdf-fallback" id="pdfFallback">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c5cae9" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="12" x2="12" y2="18"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      <p>Your browser cannot display this PDF inline.</p>
      <a href="{{ img_url }}" download>⬇ Download Certificate PDF</a>
      <a href="{{ img_url }}" target="_blank">🔗 Open in New Tab</a>
    </div>

    <script>
      var frame = document.getElementById('pdfFrame');
      var fallback = document.getElementById('pdfFallback');
      frame.addEventListener('error', function() {
        frame.style.display = 'none';
        fallback.style.display = 'flex';
      });
      setTimeout(function() {
        try {
          if (!frame.contentDocument && !frame.contentWindow) {
            frame.style.display = 'none';
            fallback.style.display = 'flex';
          }
        } catch(e) {
          frame.style.display = 'none';
          fallback.style.display = 'flex';
        }
      }, 3000);
    </script>

  {% else %}
    <img src="{{ img_url }}"
         alt="Certificate of {{ cert.student_name }}" />
  {% endif %}
</div>

</body>
</html>
